name: Deploy AuditFlow Backend

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - "deploy/docker-compose.backend.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  verify-prod:
    name: "✅ Build Backend"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  deploy:
    name: "🚀 Deploy Backend to VPS"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: verify-prod
    environment: production
    env:
      DEPLOY_PATH: /home/auditflow/prod-backend
      COMPOSE_FILE: docker-compose.backend.yml
      SSH_HOST: "${{ secrets.VPS_HOST }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        env:
          VARS_JSON: ${{ toJSON(vars) }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "NODE_ENV=production" > .env
          
          # Add all vars to .env (safely quoted)
          echo "$VARS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value|tojson)"' >> .env
          
          # Add secrets to .env (excluding SSH/VPS secrets)
          echo "$SECRETS_JSON" | jq -r 'del(.github_token, .SSH_PRIVATE_KEY, .SSH_PRIVATE_KEY_BASE64, .VPS_HOST, .VPS_USER, .VPS_PORT) | to_entries[] | "\(.key)=\(.value|tojson)"' >> .env
      
      - name: Verify .env file was created
        run: |
          echo "📄 .env file contents (secrets hidden):"
          cat .env | grep -v "PASSWORD\|SECRET\|KEY" || true
          echo ""
          echo "✅ .env file exists and contains $(wc -l < .env) lines"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directory on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_PATH }}"
            echo "✅ Deploy directory ready"
          EOF

      - name: Sync files to VPS
        run: |
          # Copy docker-compose and .env
          scp deploy/${{ env.COMPOSE_FILE }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.backend.yml
          scp .env \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/.env
          
          # Sync backend folder (without trailing slash to preserve folder structure)
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env.*' \
            --exclude='coverage' \
            backend \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Clean Docker before deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            echo "🧹 Cleaning Docker (without touching volumes)..."
            docker container prune -f || true
            docker image prune -a -f || true
            docker builder prune -a -f || true
            docker network prune -f || true
            echo "✅ Cleanup completed"
          EOF

      - name: Deploy services on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            
            echo "🚀 Building and deploying services..."
            
            # Build images from local context
            echo "🏗️ Building backend image..."
            docker compose -f ${{ env.COMPOSE_FILE }} build
            
            # Deploy services
            echo "🚢 Deploying services..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
            
            # Wait for services to be ready
            sleep 15
            
            # Apply database migrations
            echo "📦 Applying database migrations..."
            docker compose -f ${{ env.COMPOSE_FILE }} exec -T backend npx prisma migrate deploy
            
            echo "✅ Deployment completed"
          EOF

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            
            echo "📊 Checking services status..."
            docker compose -f ${{ env.COMPOSE_FILE }} ps
            
            echo ""
            echo "📋 Backend logs (last 30 lines):"
            docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=30 backend
          EOF
