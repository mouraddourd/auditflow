name: Deploy AuditFlow Backend

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  verify-prod:
    name: "✅ Build Backend"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

  deploy:
    name: "🚀 Deploy Backend to VPS"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: verify-prod
    environment: production
    env:
      DEPLOY_PATH: /home/auditflow/prod-backend
      COMPOSE_FILE: docker-compose.backend.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env <<EOF
          NODE_ENV=production
          API_DOMAIN=${{ vars.PROD_API_DOMAIN }}
          BACKEND_PORT=${{ vars.PROD_BACKEND_PORT }}
          POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          EOF

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deploy directory on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_PATH }}"
            echo "✅ Deploy directory ready"
          EOF

      - name: Sync backend files to VPS
        run: |
          rsync -avz \
            --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.windsurf' \
            backend \
            deploy/${{ env.COMPOSE_FILE }} \
            .env \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Clean Docker before deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            docker container prune -f || true
            docker image prune -a -f || true
            docker builder prune -a -f || true
            docker network prune -f || true
            echo "✅ Docker cleanup completed"
          EOF

      - name: Deploy services on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            docker compose -f ${{ env.COMPOSE_FILE }} build
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
            docker compose -f ${{ env.COMPOSE_FILE }} exec -T backend sh -c "npx prisma migrate deploy"
            echo "✅ Deployment completed"
          EOF

      - name: Verify deployment
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"
            docker compose -f ${{ env.COMPOSE_FILE }} ps
            docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=30 backend
          EOF
