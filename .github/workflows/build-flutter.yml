name: Build & Publish Flutter APK

on:
  push:
    branches: ["master"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "android/**"
      - "deploy/downloads/**"
      - "deploy/docker-compose.downloads.yml"
      - ".github/workflows/build-flutter.yml"
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Numéro de build (override)'
        required: false
        type: string

jobs:
  build-android:
    name: "🤖 Build Android APK"
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
    env:
      FLUTTER_VERSION: "3.27.4"
      API_BASE_URL: https://${{ vars.PROD_API_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AUDITFLOW_KEYSTORE_BASE64 }}
          KEY_ALIAS: auditflow
          KEY_PASSWORD: ${{ secrets.AUDITFLOW_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.AUDITFLOW_STORE_PASSWORD }}
        run: |
          # Create keystore directory
          mkdir -p ~/.android
          
          # If keystore secret exists, decode it
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/auditflow-release.jks
            echo "KEYSTORE_FILE=$HOME/.android/auditflow-release.jks" >> $GITHUB_ENV
          else
            # Generate new keystore if not exists
            cd ~/.android
            keytool -genkey -v \
              -keystore auditflow-release.jks \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -alias auditflow \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=AuditFlow, OU=Development, O=AuditFlow, L=Paris, ST=France, C=FR"
            echo "KEYSTORE_FILE=$HOME/.android/auditflow-release.jks" >> $GITHUB_ENV
            
            # Output base64 for user to save as secret
            echo "NEW_KEYSTORE_BASE64=$(base64 -w0 auditflow-release.jks)" >> $GITHUB_OUTPUT
            echo "⚠️ New keystore generated. Save the base64 output as AUDITFLOW_KEYSTORE_BASE64 secret."
          fi
          
          echo "KEY_ALIAS=auditflow" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV

      - name: Extract version info
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=${{ github.run_number }}
          if [ "${{ github.event.inputs.build_number }}" != "" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "artifact_name=auditflow-${VERSION}-${BUILD_NUMBER}.apk" >> $GITHUB_OUTPUT
          echo "📦 Building version $VERSION (build $BUILD_NUMBER)"

      - name: Build APK
        run: |
          flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build_number }} --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version.outputs.artifact_name }}
          cp build/app/outputs/flutter-apk/${{ steps.version.outputs.artifact_name }} build/app/outputs/flutter-apk/auditflow.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/${{ steps.version.outputs.artifact_name }}
            build/app/outputs/flutter-apk/auditflow.apk
          retention-days: 30

  publish-to-vps:
    name: "📤 Publish to VPS"
    runs-on: ubuntu-latest
    needs: build-android
    environment: production
    env:
      DEPLOY_PATH: /home/auditflow/downloads
      DOWNLOADS_DOMAIN: ${{ vars.PROD_DOWNLOADS_DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./apk

      - name: Extract version info
        id: version
        run: |
          VERSION="${{ needs.build-android.outputs.version }}"
          BUILD_NUMBER="${{ needs.build-android.outputs.build_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📦 Publishing version $VERSION (build $BUILD_NUMBER)"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare downloads directory
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            sudo mkdir -p /var/downloads/android /var/downloads/ios
            sudo chown -R ubuntu:ubuntu /var/downloads
            echo "✅ Downloads directory ready"
          EOF

      - name: Upload APK and update releases
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ steps.version.outputs.build_number }}"
          APK_SIZE=$(stat -c%s ./apk/auditflow.apk)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          RELEASE_NOTES="Build ${BUILD_NUMBER} - Corrections UI/UX et migrations"
          
          # Upload APK to VPS temp location
          scp -i ~/.ssh/id_rsa ./apk/auditflow.apk ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/auditflow.apk
          
          # Upload static files
          scp -i ~/.ssh/id_rsa deploy/downloads/index.html ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/downloads/index.html
          
          # Generate JSON files locally first
          jq -n \
            --arg version "$VERSION" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --argjson androidSize "$APK_SIZE" \
            --arg releaseDate "$RELEASE_DATE" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{version: $version, buildNumber: $buildNumber, androidAvailable: true, androidSize: $androidSize, androidUrl: "/android/auditflow.apk", iosAvailable: false, iosSize: 0, iosUrl: "", releaseDate: $releaseDate, releaseNotes: $releaseNotes}' > version.json
          
          jq -n \
            --arg version "$VERSION" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --argjson androidSize "$APK_SIZE" \
            --arg releaseDate "$RELEASE_DATE" \
            --arg releaseNotes "$RELEASE_NOTES" \
            '{latest: {version: $version, buildNumber: $buildNumber, androidAvailable: true, androidSize: $androidSize, androidUrl: "/android/auditflow.apk", iosAvailable: false, iosSize: 0, iosUrl: "", releaseDate: $releaseDate, releaseNotes: $releaseNotes}, releases: [{version: $version, buildNumber: $buildNumber, date: $releaseDate, changes: [$releaseNotes]}], platforms: {android: {available: true, latestApk: "/android/auditflow.apk"}, ios: {available: false, latestIpa: null}}}' > releases.json
          
          echo "✅ Generated version.json:"
          cat version.json
          echo ""
          echo "✅ Generated releases.json:"
          cat releases.json
          
          # Upload JSON files to VPS
          scp -i ~/.ssh/id_rsa version.json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/downloads/version.json
          scp -i ~/.ssh/id_rsa releases.json ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/downloads/releases.json
          
          # Update releases on VPS
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<EOF
            set -euo pipefail
            cd /var/downloads
            
            # Create version directory
            mkdir -p "android/v${VERSION}"
            
            # Copy versioned APK
            cp /tmp/auditflow.apk "android/v${VERSION}/auditflow-${VERSION}.apk"
            
            # Update latest symlink
            ln -sf "v${VERSION}/auditflow-${VERSION}.apk" android/auditflow.apk
            
            echo "✅ Release ${VERSION} (build ${BUILD_NUMBER}) published successfully"
          EOF

      - name: Deploy downloads service
        run: |
          scp -i ~/.ssh/id_rsa deploy/docker-compose.downloads.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_PATH }}/docker-compose.downloads.yml
          
          ssh -i ~/.ssh/id_rsa ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd "${{ env.DEPLOY_PATH }}"

            cat > .env <<EOT
            DOWNLOADS_DOMAIN=${{ env.DOWNLOADS_DOMAIN }}
            EOT
            
            # Stop existing container if running
            docker compose -f docker-compose.downloads.yml down --remove-orphans || true
            
            # Start the service
            docker compose --env-file .env -f docker-compose.downloads.yml up -d
            sleep 5
            docker compose --env-file .env -f docker-compose.downloads.yml ps
            echo "✅ Downloads service deployed"
          EOF

      - name: Verify deployment
        run: |
          curl -I https://${{ env.DOWNLOADS_DOMAIN }}/releases.json || echo "Warning: Domain may need DNS update"
