networks:
  proxy_public:
    external: true

services:
  downloads:
    image: nginx:alpine
    volumes:
      - downloads_data:/usr/share/nginx/html:ro
    networks:
      - proxy_public
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.auditflow-downloads.rule=Host(`${DOWNLOADS_DOMAIN}`)"
      - "traefik.http.routers.auditflow-downloads.entrypoints=web,websecure"
      - "traefik.http.routers.auditflow-downloads.tls.certresolver=myresolver"
      - "traefik.http.routers.auditflow-downloads.service=auditflow-downloads"
      - "traefik.http.services.auditflow-downloads.loadbalancer.server.port=80"

volumes:
  downloads_data:
